<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>andanh447 - Trùm Script iOS</title>
    <style>
        /* Import font chữ hiện đại, cao cấp từ Google */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        /* Hiệu ứng kính mờ Glassmorphism cao cấp */
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 45px 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            max-width: 90%;
            width: 420px;
        }
        
        h1 { 
            color: #38bdf8; 
            font-size: 2.5em; 
            margin: 0 0 8px 0; 
            letter-spacing: 1.5px;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }
        
        .subtitle { 
            font-size: 1.05em; 
            color: #94a3b8; 
            margin-bottom: 35px; 
            font-weight: 400;
        }
        
        /* Khung chứa danh sách Script */
        .features {
            text-align: left;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .features p { 
            font-size: 1.1em; 
            margin: 15px 0; 
            display: flex;
            align-items: center;
            font-weight: 600;
        }
        
        .features p::before {
            content: '✨';
            margin-right: 12px;
            font-size: 1.1em;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        
        .highlight { 
            color: #10b981; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .contact {
            color: #f87171;
            font-weight: 600;
            margin-bottom: 25px;
            background: rgba(248, 113, 113, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        
        /* Nút bấm gradient hiện đại */
        .btn { 
            background: linear-gradient(135deg, #0ea5e9, #3b82f6); 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 600;
            padding: 15px 30px; 
            border-radius: 50px; 
            display: inline-block; 
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
            letter-spacing: 0.5px;
        }
        
        .btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(14, 165, 233, 0.5); 
            background: linear-gradient(135deg, #38bdf8, #60a5fa);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>andanh447</h1>
        <div class="subtitle">Chuyên cung cấp kịch bản (Script) tối ưu hóa mạng iOS</div>
        
        <div class="features">
            <p><span class="highlight">Hệ sinh thái Shadowrocket</span></p>
            <p>Locket Gold quay 30/60/90 giây đều mượt</p>
            <p>YouTube Premium</p>
            <p>SoundCloud Go+</p>
        </div>
        
        <div class="contact">📞 Yêu cầu script (Zép lào): 0901894517</div>
        <br>
        <a href="https://github.com/andanh447" class="btn">Truy cập Kho GitHub của tao</a>
    </div>
</body>
</html>
